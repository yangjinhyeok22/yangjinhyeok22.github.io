/* 배치: 1990년대 PC통신 단말기 한 화면. 가상 화면(가로 320 또는 512, 세로 500)을 그리고 통째로 확대한다.
   파란 바탕에 회색 대화 상자, 맨 위 제목 줄, 맨 아래 명령 줄과 기능 키 줄. */
:root{
  --room:#05071d; --bezel:#1b1d26; --bezel-hi:#3a3e4c;
  --bg:#0b1d9e; --bg2:#081570; --fg:#cdd5ec; --hi:#ffffff; --dim:#8c9ad6;
  --cy:#5ff0ee; --ye:#ffea5c; --rd:#ff6b62; --gr:#79ef8a;
  --dlg:#c9c9c4; --dlg-hi:#f4f4ef; --dlg-lo:#6c6c68; --ink:#141414; --pen:#d8332a;
  --px:"NeoDunggeunmo","DungGeunMo","D2Coding","NanumGothicCoding","Malgun Gothic","Apple SD Gothic Neo",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(110% 80% at 50% 30%,#10163d,var(--room) 70%);color:var(--fg);overflow:hidden;font-family:var(--px)}
#wrap{height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
#mon{position:relative;flex:none;border-radius:14px;padding:12px;background:linear-gradient(180deg,var(--bezel-hi),var(--bezel) 30%);
  box-shadow:0 0 0 1px #000,0 18px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12)}
#holder{position:relative;overflow:hidden;border-radius:6px;background:var(--bg)}
#scr{position:absolute;left:0;top:0;height:500px;transform-origin:0 0;background:var(--bg);color:var(--fg);
  font:16px/20px var(--px);letter-spacing:0;font-kerning:none;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#scr::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:20;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px),radial-gradient(120% 100% at 50% 50%,transparent 60%,rgba(0,0,20,.45))}
#scr b,#scr i,#scr em,#scr s{font-style:normal;font-weight:normal}
.hi{color:var(--hi)} .cy{color:var(--cy)} .ye{color:var(--ye)} .rd{color:var(--rd)} .gr{color:var(--gr)} .dm{color:var(--dim)}

/* 고정 줄 */
.bar,.hint,.cmd,.fn{position:absolute;left:0;right:0;height:20px;box-sizing:border-box;padding:0 8px;display:flex;align-items:center;justify-content:space-between;white-space:nowrap;overflow:hidden}
.bar{top:0;background:var(--cy);color:#001;gap:8px}
.bar .dot{color:#b00}
.hint{top:440px;color:var(--dim)}
.cmd{top:460px;justify-content:flex-start;gap:0;background:var(--bg2)}
.cmd label{color:var(--ye);flex:none}
.cmd input{flex:1;min-width:0;height:20px;border:0;margin:0 0 0 8px;padding:0;background:transparent;color:var(--hi);font:16px/20px var(--px);caret-color:var(--ye);outline:none;-webkit-user-select:text;user-select:text;border-radius:0;-webkit-appearance:none;appearance:none}
.cmd input::placeholder{color:var(--dim)}
.fn{top:480px;background:var(--fg);color:#001;justify-content:flex-start;gap:4px;padding:0 4px}
.fn button{border:0;margin:0;padding:0 4px;height:20px;background:transparent;color:#001;font:16px/20px var(--px);cursor:pointer;white-space:nowrap}
.fn button b{background:#001;color:var(--fg);padding:0 3px;margin-right:3px}
.fn button:active{background:var(--ye)}

#main{position:absolute;left:0;right:0;top:20px;height:420px;box-sizing:border-box;padding:6px 8px 8px;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:thin;scrollbar-color:var(--cy) var(--bg2)}
#main.in>*{animation:rowin .12s steps(3) both}
#main.in>*:nth-child(2){animation-delay:.02s}#main.in>*:nth-child(3){animation-delay:.04s}#main.in>*:nth-child(4){animation-delay:.06s}#main.in>*:nth-child(n+5){animation-delay:.08s}
.l{min-height:20px;line-height:20px;word-break:keep-all;overflow-wrap:anywhere}
.gap{height:10px}

/* 테두리 상자(이중선)와 회색 대화 상자 */
.box{position:relative;border:4px double var(--cy);padding:12px 6px 6px;margin:12px 0 8px}
.box>.tt{position:absolute;top:-12px;left:10px;padding:0 4px;background:var(--bg);color:var(--hi);white-space:nowrap}
.dlg{position:relative;background:var(--dlg);color:var(--ink);margin:6px 8px 16px 0;padding:10px 12px;
  border-top:2px solid var(--dlg-hi);border-left:2px solid var(--dlg-hi);border-right:2px solid var(--dlg-lo);border-bottom:2px solid var(--dlg-lo);box-shadow:8px 8px 0 rgba(0,0,0,.55)}
.dlg .tt{position:absolute;left:0;right:0;top:-22px;height:20px;background:var(--bg2);color:var(--hi);padding:0 6px;display:none}
.dlg .rd{color:#c41e14}
.dlg .dm{color:#55554f}

/* 메뉴 줄 */
.it{display:flex;align-items:center;width:100%;min-height:26px;box-sizing:border-box;margin:0;padding:0 4px;border:0;background:transparent;color:var(--fg);
  font:16px/20px var(--px);text-align:left;text-decoration:none;cursor:pointer;gap:6px}
.it .n{flex:none;min-width:22px;color:var(--ye)}
.it .t{flex:none;color:var(--hi);white-space:nowrap}
.it .d{flex:1;min-width:8px;height:0;border-bottom:2px dotted rgba(140,154,214,.55);margin-top:6px}
.it .r{flex:none;color:var(--cy);white-space:nowrap}
.it:hover,.it:focus-visible,.it.on{background:var(--cy);outline:none}
.it:hover *,.it:focus-visible *,.it.on *{color:#001!important;border-color:rgba(0,0,30,.4)!important}
.it:active{background:var(--ye)}

/* 문제 */
.qhd{display:flex;justify-content:space-between;align-items:center;margin:4px 0 6px;white-space:nowrap}
.pips span{display:inline-block;width:18px;text-align:center}
.warn{display:inline-block;background:var(--rd);color:#fff;padding:0 6px;margin:2px 0 4px;animation:warn .5s steps(2) 4}
.calm{color:var(--dim);margin:2px 0 4px}
.sent{font-size:24px;line-height:36px;word-break:keep-all;overflow-wrap:anywhere;min-height:72px;padding:2px 0}
.sent .w{display:inline-block;white-space:pre}
.blank{display:inline-block;background:var(--ye);color:#000;text-align:center;line-height:30px;height:30px;margin:0 2px;animation:blk 1s steps(2) infinite}
#qw{display:inline-block;padding:0 3px;margin:0 2px;white-space:pre;line-height:30px}
#qw.fix{color:#c41e14;animation:pop .2s steps(3) 1}
.ops{display:flex;flex-direction:column;gap:10px;margin:14px 0 8px}
.op{display:flex;align-items:center;gap:10px;width:100%;height:48px;box-sizing:border-box;margin:0;padding:0 10px;cursor:pointer;
  background:var(--bg2);color:var(--hi);border:2px solid var(--cy);font:24px/24px var(--px);text-align:left;box-shadow:4px 4px 0 rgba(0,0,0,.5)}
.op .n{flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--ye);color:#000;font-size:16px}
.op .v{white-space:pre;overflow:hidden}
.op .v.s{font-size:16px}
.op:hover,.op:focus-visible{background:#13289c;outline:none}
.op:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.op.hit{background:var(--cy);color:#001;border-color:var(--hi)}
.op.miss{opacity:.45}
.op.off{opacity:.35}
.msg{min-height:20px;margin-top:4px}
.ex{border:2px solid var(--rd);padding:6px 8px;margin:8px 0;background:rgba(0,0,0,.18)}
.ex .h{color:var(--rd)}
.shake{animation:shake .22s steps(6) 1}

/* 결과 */
.score{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.score .big{font-size:32px;line-height:36px}
.marks{font-size:24px;line-height:30px;color:#c41e14;letter-spacing:4px;margin-top:4px}
.stamp{flex:none;width:72px;height:72px;box-sizing:border-box;border-radius:50%;border:3px solid #c41e14;color:#c41e14;transform:rotate(-12deg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:18px;box-shadow:inset 0 0 0 2px var(--dlg),inset 0 0 0 3px #c41e14;animation:stamp .2s steps(4) both}
.pre{white-space:pre-wrap;word-break:break-all;color:var(--fg);border:2px dashed var(--dim);padding:6px 8px;margin:6px 0}

/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:2px}
.cal span{height:24px;line-height:24px;position:relative}
.cal .wd{color:#55554f}
.cal .t{background:#fff3a8}
.cal .mut{color:#8d8d86}
.cal .ok::after,.cal .pf::after{content:"";position:absolute;left:50%;top:1px;width:20px;height:20px;margin-left:-11px;border:2px solid #c41e14;border-radius:50%;transform:rotate(-8deg)}
.cal .pf::after{box-shadow:0 0 0 2px var(--dlg),0 0 0 4px #c41e14}

/* 찾기 */
.verdict{font-size:24px;line-height:32px}
.verdict s{color:#55554f;text-decoration:line-through;text-decoration-color:#c41e14;text-decoration-thickness:3px}
.verdict b{color:#c41e14}

/* 여는 화면 */
#boot{position:absolute;inset:0;z-index:12;background:var(--bg);padding:14px 12px;box-sizing:border-box}
#boot.out{animation:wipe .22s steps(5) forwards}
#boot .l{color:var(--fg)}
#boot .ban{margin:18px 0 0;text-align:center;padding:18px 10px 16px}
#boot .ban .the{display:inline-block;background:#c41e14;color:#fff;padding:0 6px;font-size:16px;line-height:20px}
#boot .ban .t1{font-size:40px;line-height:48px;margin-top:10px;white-space:nowrap}
#boot .ban .t2{font-size:40px;line-height:48px;color:#c41e14;white-space:nowrap}
#boot .ban .sub{color:#55554f;margin-top:10px}
#boot .cur{display:inline-block;width:8px;height:16px;background:var(--fg);vertical-align:-2px;animation:blk .5s steps(2) infinite}

#ink{position:absolute;left:0;top:0;height:500px;pointer-events:none;z-index:14}
#pen{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:15;transform-origin:0 0}
#pen svg{position:absolute;left:0;top:-5px;width:52px;height:10px;overflow:visible}
#fx{position:absolute;inset:0;pointer-events:none;z-index:16}
.toast{position:absolute;left:50%;top:200px;transform:translateX(-50%);background:var(--ye);color:#000;padding:4px 10px;white-space:nowrap;box-shadow:4px 4px 0 rgba(0,0,0,.5);animation:toast 1.3s steps(8) forwards}
.pop{position:absolute;color:var(--ye);white-space:nowrap;animation:popup .55s steps(8) forwards}

#scr button:focus-visible,#scr a:focus-visible{outline:2px dashed var(--ye);outline-offset:-2px}

@keyframes blk{50%{opacity:.25}}
@keyframes warn{50%{background:var(--ye);color:#000}}
@keyframes rowin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes pop{from{transform:scale(1.5)}to{transform:none}}
@keyframes popup{from{transform:translateY(4px);opacity:0}25%{opacity:1}to{transform:translateY(-14px);opacity:0}}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
@keyframes toast{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes wipe{to{clip-path:inset(0 0 100% 0)}}
@media (prefers-reduced-motion:reduce){
  #main.in>*,.warn,.blank,.stamp,#qw.fix,.shake,#boot .cur{animation:none}
  #boot.out{animation:none;opacity:0}
}

/* 스크립트가 뜨기 전(또는 검색 로봇)에 보이는 소개 */
#main .seo h1{font:24px/1.3 var(--px);color:var(--ye);margin:6px 0}
#main .seo p,#main .seo li{line-height:1.5}
#main .seo a{color:var(--cy)}

<script>
/* ===================================================================
   문제 은행 — 헷갈리는 표현 사전
   F(id, 난이도, 바른 말, 틀린 말, 풀이, 문장들, 덧붙임)  틀린 말이 어디서도 안 쓰이는 경우
   C(id, 난이도, [말1, 말2] 또는 이름, 풀이, 문장들, 덧붙임)  둘 다 있는 말이라 문맥으로 가리는 경우
   L(id, 난이도, 바른 표기, 틀린 표기, 원어, 문장)  외래어
   문장: [문장('{}'가 빈칸), 정답, 오답, 난이도(생략 가능), 공유 문구용 이름(생략 가능)]
   덧붙임: x {틀린 꼴: 바른 꼴} 찾기에서 바로 판정 / m [[말, 뜻]] / k [찾기용 열쇠말] / nk 보기를 열쇠말로 쓰지 않음
   난이도: 1 순한맛, 2 보통맛, 3 매운맛
   사이시옷이 들어가야 정답인 말은 넣지 않는다(규정 개정 추진 중, 2026년 1월 국립국어원 발표).
   =================================================================== */
var BANK = [];
(function () {
  function add(type, id, lv, label, rule, qs, ex) {
    ex = ex || {};
    BANK.push({
      id: id, lv: lv, type: type, label: label, rule: rule,
      qs: qs.map(function (q) { return { s: q[0], a: q[1], b: q[2], lv: q[3] || lv, l: q[4] || null }; }),
      x: ex.x || {}, m: ex.m || null, k: ex.k || [], nk: !!ex.nk
    });
  }
  function F(id, lv, right, wrong, rule, qs, ex) { add('F', id, lv, [right, wrong], rule, qs, ex); }
  function C(id, lv, label, rule, qs, ex) { add('C', id, lv, label, rule, qs, ex); }
  function hasBatchim(w) { var c = w.charCodeAt(w.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0; }
  function L(id, lv, right, wrong, eng, s) {
    add('F', id, lv, [right, wrong], '‘' + right + '’' + (hasBatchim(right) ? '이' : '가') + ' 맞습니다. (' + eng + ')', [[s, right, wrong]], {});
  }

  /* ---------- 순한맛: 누구나 한 번은 틀리는 것 ---------- */
  C('doe', 1, ['되', '돼'], "‘돼’는 ‘되어’의 준말입니다. ‘하’를 넣어 어울리면 ‘되’, ‘해’가 어울리면 ‘돼’.", [
    ["그러면 안 {}.", "돼", "되"],
    ["일이 잘 {} 다행이야.", "돼서", "되서"],
    ["커서 의사가 {} 싶어요.", "되고", "돼고"],
    ["준비 다 {}?", "됐어", "됬어"]],
    { x: { 되요: '돼요', 되서: '돼서', 됬어: '됐어', 됬다: '됐다', 돼고: '되고', 돼면: '되면', 돼는: '되는', 안되요: '안 돼요', 않돼: '안 돼' } });
  C('an', 1, ['안', '않'], "‘안’은 ‘아니’, ‘않’은 ‘아니하’의 준말입니다. 풀어 써서 말이 되는 쪽이 맞습니다.", [
    ["숙제를 {} 했다.", "안", "않"],
    ["숙제를 하지 {}.", "않았다", "안았다"],
    ["말도 하지 {} 나갔다.", "않고", "안고"]],
    { x: { 않해: '안 해', 않했다: '안 했다', 않되: '안 되', 않가: '안 가', 않먹어: '안 먹어' } });
  F('myeochil', 1, '며칠', '몇일', "‘몇 일’로 적지 않습니다. 날짜도 기간도 언제나 ‘며칠’입니다.", [
    ["오늘이 몇 월 {}이지?", "며칠", "몇일"],
    ["{} 동안 푹 쉬었다.", "며칠", "몇일"]]);
  C('eotteok', 1, ['어떡해', '어떻게'], "‘어떡해’는 ‘어떻게 해’의 준말이라 문장을 끝냅니다. ‘어떻게’는 뒷말을 꾸밉니다.", [
    ["나 이제 {}?", "어떡해", "어떻해"],
    ["이걸 {} 하지?", "어떻게", "어떡해"],
    ["지갑을 두고 왔네, {}.", "어떡하지", "어떻하지", 2]],
    { x: { 어떻해: '어떡해', 어떻하지: '어떡하지', 어떻하냐: '어떡하냐', 어떻하죠: '어떡하죠' } });
  C('wen', 1, ['왠', '웬'], "‘왠지’(왜인지)만 ‘왠’입니다. 웬일, 웬만하면, 웬 떡은 모두 ‘웬’.", [
    ["오늘은 {} 기분이 좋다.", "왠지", "웬지"],
    ["여기까지 {}이야?", "웬일", "왠일"],
    ["{} 일찍 다녀와.", "웬만하면", "왠만하면", 2],
    ["이게 {} 떡이야?", "웬", "왠", 2]],
    { x: { 웬지: '왠지', 왠일: '웬일', 왠만하면: '웬만하면', 왠만: '웬만', 왠떡: '웬 떡' } });
  F('geumse', 1, '금세', '금새', "‘금시에’가 줄어든 말이라 ‘금세’입니다.", [
    ["소문이 {} 퍼졌다.", "금세", "금새"],
    ["약을 먹자 {} 나았다.", "금세", "금새"]]);
  F('oraenman', 1, '오랜만', '오랫만', "‘오래간만’의 준말이라 ‘오랜만’입니다.", [
    ["정말 {}이다.", "오랜만", "오랫만"],
    ["{}에 친구를 만났다.", "오랜만", "오랫만"]]);
  F('seolgeoji', 1, '설거지', '설겆이', "‘설겆다’가 사라진 말이라 소리대로 ‘설거지’로 적습니다.", [
    ["저녁 {}는 내가 할게.", "설거지", "설겆이"]]);
  F('jjigae', 1, '찌개', '찌게', "‘찌개’가 표준어입니다. 김치찌개, 된장찌개.", [
    ["{}가 보글보글 끓는다.", "김치찌개", "김치찌게"]]);
  F('yeokhal', 1, '역할', '역활', "‘역할’이 맞습니다. ‘역활’은 없는 말입니다.", [
    ["각자 맡은 {}이 있다.", "역할", "역활"]]);
  F('huihan', 1, '희한하다', '희안하다', "드물 희, 드물 한 자를 써서 ‘희한’입니다.", [
    ["참 {} 일이네.", "희한한", "희안한"]]);
  F('eoi', 1, '어이없다', '어의없다', "‘어이’는 ‘어처구니’와 같은 말입니다. ‘어의’는 임금의 의원.", [
    ["너무 {} 말이 안 나온다.", "어이없어서", "어의없어서"]]);
  F('guji', 1, '굳이', '구지', "‘굳다’에서 온 말이라 ‘굳이’로 적고 [구지]로 읽습니다.", [
    ["{} 그럴 필요 없어.", "굳이", "구지"]]);
  C('ilbureo', 1, ['일부러', '일부로'], "‘마음먹고 짐짓’은 ‘일부러’입니다. ‘일부로’는 ‘한 부분으로’라는 뜻.", [
    ["{} 져 준 거야.", "일부러", "일부로"]]);
  C('munan', 1, ['무난', '문안'], "탈이 없다는 뜻은 ‘무난’입니다. ‘문안’은 안부를 여쭙는 일.", [

  C('yaegi', 1, ['얘기', '예기'], "‘이야기’의 준말은 ‘얘기’입니다. ‘예기’는 미리 헤아린다는 뜻.", [
    ["잠깐 {} 좀 하자.", "얘기", "예기"]]);
  C('gyeolje', 1, ['결재', '결제'], "돈을 치르는 일은 ‘결제’, 윗사람이 안건을 승인하는 일은 ‘결재’.", [
    ["카드로 {}할게요.", "결제", "결재"],
